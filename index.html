<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 PROJECT-0 | 2인 개발 협업 툴</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- 비밀번호 입력 팝업 화면 -->
<div id="lock-screen">
  <div class="lock-box">
    <h2>PROJECT-0</h2>
    <p>팀 4자리 비밀번호를 입력해주세요.</p>
    <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••" onkeypress="handlePinKey(event)" autofocus>
    <button class="rose-btn" style="width: 100%; padding: 10px;" onclick="checkPin()">접속하기</button>
  </div>
</div>

<div class="container" id="app-container" style="display: none;">
  <!-- 상단 헤더 -->
  <header>
    <div class="header-left">
      <h1>🌸 PROJECT-0</h1>
      <p>2인 기획·개발 협업 대시보드</p>
    </div>
    <button class="logout-btn" onclick="logout()">🔒 잠금</button>
  </header>

  <!-- 대시보드 레이아웃 -->
  <div class="dashboard-layout">
    
    <!-- 로드맵 -->
    <div class="roadmap-card">
      <div class="roadmap-header">
        <span class="roadmap-title">프로젝트 로드맵</span>
        <span class="roadmap-badge">STEP 2 진행</span>
      </div>

      <div class="roadmap-steps">
        <div class="step-box step-1">
          <div class="step-label" style="color: var(--rose-medium);">STEP 1 완료</div>
          <div class="step-name" style="color: var(--rose-deep);">기반 환경 구축</div>
          <div class="step-desc">배포 & 모바일 연동</div>
        </div>
        <span class="step-arrow">➜</span>

        <div class="step-box step-2">
          <div class="step-label" style="color: var(--primary);">STEP 2 진행 🚀</div>
          <div class="step-name" style="color: var(--rose-deep);">협업 보드 확장</div>
          <div class="step-desc">메뉴 탭 & 실시간 기록</div>
        </div>
        <span class="step-arrow">➜</span>

        <div class="step-box step-inactive">
          <div class="step-label" style="color: #999;">STEP 3</div>
          <div class="step-name" style="color: #777;">데이터 보관소</div>
          <div class="step-desc">자료 & 영상 아카이빙</div>
        </div>
        <span class="step-arrow">➜</span>

        <div class="step-box step-inactive">
          <div class="step-label" style="color: #bbb;">STEP 4</div>
          <div class="step-name" style="color: #999;">핵심 기능 개발</div>
          <div class="step-desc">본격 기능 구현·테스트</div>
        </div>
      </div>
    </div>

    <!-- 우측 메인 작업 영역 -->
    <div class="board-section">
      <!-- 탭 메뉴 바 -->
      <div class="tab-bar">
        <button id="btn-t" class="tab-btn active" onclick="switchTab('tasks')">진행목록</button>
        <button id="btn-m" class="tab-btn" onclick="switchTab('meetings')">회의록</button>
        <button id="btn-i" class="tab-btn" onclick="switchTab('ideas')">아이디어</button>
        <button id="btn-r" class="tab-btn" onclick="switchTab('resources')">자료 링크</button>
      </div>

      <!-- 1. 진행목록 화면 -->
      <div id="tab-tasks" class="tab-content active">
        <div style="background: white; border-radius: 10px; padding: 14px 16px; border: 1.2px solid var(--border); margin-bottom: 8px;">
          <h3 style="color: var(--rose-deep); margin: 0 0 10px 0; font-size: 0.95rem; font-weight: 800;">새 작업 등록</h3>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input type="text" id="task-input" placeholder="새 작업을 입력하세요..." style="flex: 2; min-width: 160px;" onkeypress="handleTaskKey(event)">
            <input type="text" id="task-author" placeholder="작성자" style="flex: 0.8; min-width: 90px;">
            <button class="rose-btn" style="width: auto; padding: 9px 20px;" onclick="addTask()">추가</button>
          </div>
        </div>

        <div class="list-header-bar">
          <div></div>
          <button class="sort-text-btn" onclick="toggleSort('tasks')">
            <span id="sort-label-tasks">최신순 ⬇</span>
          </button>
        </div>

        <div class="list-container" id="tasks-list"></div>
      </div>

      <!-- 2. 회의록 탭 -->
      <div id="tab-meetings" class="tab-content">
        <div style="background: white; border-radius: 10px; padding: 14px 16px; border: 1.2px solid var(--border); display: flex; flex-direction: column;">
          <h3 style="color: var(--rose-deep); margin: 0 0 10px 0; font-size: 0.95rem; font-weight: 800;">회의록 작성</h3>
          <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 140px;">
              <label for="m-date" style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:3px; color:var(--rose-deep);">회의 날짜</label>
              <input type="date" id="m-date">
            </div>
            <div style="flex: 1; min-width: 140px;">
              <label for="m-author" style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:3px; color:var(--rose-deep);">작성자</label>
              <input type="text" id="m-author" placeholder="작성자 이름">
            </div>
          </div>
          <div class="form-group">
            <label for="m-content">회의 내용</label>
            <textarea id="m-content" placeholder="통화나 회의에서 논의된 주요 내용을 자유롭게 기록하세요..."></textarea>
          </div>
          <button class="rose-btn" style="align-self: flex-end; width: auto; padding: 8px 22px;" onclick="addMeeting()">회의록 저장</button>
        </div>

        <div class="list-header-bar">
          <div></div>
          <button class="sort-text-btn" onclick="toggleSort('meetings')">
            <span id="sort-label-meetings">최신순 ⬇</span>
          </button>
        </div>

        <div class="list-container" id="meetings-list"></div>
      </div>

      <!-- 3. 아이디어 탭 -->
      <div id="tab-ideas" class="tab-content">
        <div style="background: white; border-radius: 10px; padding: 14px 16px; border: 1.2px solid var(--border);">
          <h3 style="color: var(--rose-deep); margin: 0 0 10px 0; font-size: 0.95rem; font-weight: 800;">아이디어 메모</h3>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <input type="text" id="idea-title" placeholder="아이디어 제목 또는 키워드" style="flex: 1.6; min-width: 150px;">
              <input type="text" id="idea-author" placeholder="작성자" style="flex: 1; min-width: 100px;">
            </div>
            <textarea id="idea-desc" rows="3" placeholder="자유로운 생각, 아이디어 상세 메모..."></textarea>
            
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 0.78rem; font-weight: 700; color: var(--rose-muted);">책갈피:</span>
                <input type="hidden" id="idea-color" value="none">
                <div class="color-picker-mini" id="idea-color-picker">
                  <div class="color-dot" style="background: var(--bm-none); transform: scale(1.35);" onclick="selectNewIdeaColor('none', this)" title="기본"></div>
                  <div class="color-dot" style="background: var(--bm-pink);" onclick="selectNewIdeaColor('pink', this)"></div>
                  <div class="color-dot" style="background: var(--bm-rose);" onclick="selectNewIdeaColor('rose', this)"></div>
                  <div class="color-dot" style="background: var(--bm-yellow);" onclick="selectNewIdeaColor('yellow', this)"></div>
                  <div class="color-dot" style="background: var(--bm-mint);" onclick="selectNewIdeaColor('mint', this)"></div>
                  <div class="color-dot" style="background: var(--bm-lavender);" onclick="selectNewIdeaColor('lavender', this)"></div>
                </div>
              </div>
              <button class="rose-btn" style="width: auto; padding: 8px 22px;" onclick="addIdea()">메모 남기기</button>
            </div>
          </div>
        </div>

        <div class="list-header-bar">
          <div class="list-filter-dots">
            <button class="dot-all-btn active" onclick="setFilter('ideas', 'all', this)">전체</button>
            <div class="dot-filter-btn" style="background: var(--bm-pink);" onclick="setFilterDot('ideas', 'pink', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-rose);" onclick="setFilterDot('ideas', 'rose', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-yellow);" onclick="setFilterDot('ideas', 'yellow', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-mint);" onclick="setFilterDot('ideas', 'mint', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-lavender);" onclick="setFilterDot('ideas', 'lavender', this)"></div>
          </div>
          <button class="sort-text-btn" onclick="toggleSort('ideas')">
            <span id="sort-label-ideas">최신순 ⬇</span>
          </button>
        </div>

        <div class="list-container" id="ideas-list"></div>
      </div>

      <!-- 4. 자료 링크 탭 -->
      <div id="tab-resources" class="tab-content">
        <div style="background: white; border-radius: 10px; padding: 14px 16px; border: 1.2px solid var(--border);">
          <h3 style="color: var(--rose-deep); margin: 0 0 10px 0; font-size: 0.95rem; font-weight: 800;">자료 및 링크 보관</h3>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <input type="text" id="res-title" placeholder="자료 이름 (예: 1회차 회의 녹화)" style="flex: 1.3; min-width: 140px;">
              <input type="text" id="res-author" placeholder="작성자" style="flex: 0.8; min-width: 90px;">
              <input type="url" id="res-url" placeholder="공유 링크 (https://...)" style="flex: 1.5; min-width: 170px;">
            </div>
            <textarea id="res-desc" rows="2" placeholder="자료에 대한 세부내용 및 참고 메모"></textarea>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 0.78rem; font-weight: 700; color: var(--rose-muted);">책갈피:</span>
                <input type="hidden" id="res-color" value="pink">
                <div class="color-picker-mini" id="res-color-picker">
                  <div class="color-dot" style="background: var(--bm-pink); transform: scale(1.35);" onclick="selectNewResColor('pink', this)"></div>
                  <div class="color-dot" style="background: var(--bm-rose);" onclick="selectNewResColor('rose', this)"></div>
                  <div class="color-dot" style="background: var(--bm-yellow);" onclick="selectNewResColor('yellow', this)"></div>
                  <div class="color-dot" style="background: var(--bm-mint);" onclick="selectNewResColor('mint', this)"></div>
                  <div class="color-dot" style="background: var(--bm-lavender);" onclick="selectNewResColor('lavender', this)"></div>
                </div>
              </div>
              <button class="rose-btn" style="width: auto; padding: 8px 22px;" onclick="addResource()">링크 저장</button>
            </div>
          </div>
        </div>

        <div class="list-header-bar">
          <div class="list-filter-dots">
            <button class="dot-all-btn active" onclick="setFilter('resources', 'all', this)">전체</button>
            <div class="dot-filter-btn" style="background: var(--bm-pink);" onclick="setFilterDot('resources', 'pink', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-rose);" onclick="setFilterDot('resources', 'rose', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-yellow);" onclick="setFilterDot('resources', 'yellow', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-mint);" onclick="setFilterDot('resources', 'mint', this)"></div>
            <div class="dot-filter-btn" style="background: var(--bm-lavender);" onclick="setFilterDot('resources', 'lavender', this)"></div>
          </div>
          <button class="sort-text-btn" onclick="toggleSort('resources')">
            <span id="sort-label-resources">최신순 ⬇</span>
          </button>
        </div>

        <div class="list-container" id="resources-list"></div>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
