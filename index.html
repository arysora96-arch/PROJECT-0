<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 PROJECT-0 | 2인 개발 협업 툴</title>
  <!-- Supabase JS 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #ff8da1; /* 파스텔 핑크 */
      --primary-soft: #fff0f3;
      --bg: #faf7f8;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --border: #f0e6e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 8px 6px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(255, 141, 161, 0.08);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* 헤더 (모바일 기본: 슬림) */
    header {
      padding: 10px 12px 8px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, var(--primary-soft) 100%);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.15rem;
      color: #1a202c;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 🗺️ 로드맵 (모바일 기본: 초슬림) */
    .roadmap-card {
      background: white;
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: 0 1px 6px rgba(255, 183, 197, 0.15);
      border: 1.2px solid #ffd1dc;
      margin: 8px 8px 4px;
    }
    .roadmap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px dashed #ffe4e9;
      padding-bottom: 4px;
    }
    .roadmap-title {
      font-size: 0.82rem;
      font-weight: bold;
      color: #d85a7f;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .roadmap-badge {
      font-size: 0.7rem;
      background: #ffe4e9;
      color: #d85a7f;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .roadmap-steps {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .step-box {
      flex: 1;
      min-width: 95px;
      border-radius: 6px;
      padding: 5px 6px;
      text-align: center;
    }
    .step-arrow {
      color: #ffd1dc;
      font-size: 0.75rem;
      font-weight: bold;
      user-select: none;
    }
    .step-label {
      font-size: 0.62rem;
      font-weight: bold;
    }
    .step-name {
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 1px;
    }
    .step-desc {
      display: none; /* 모바일에서는 숨겨서 슬림 유지 */
      font-size: 0.7rem;
      color: #718096;
      margin-top: 2px;
    }

    /* 탭 바 (모바일 기본) */
    .tab-bar {
      display: flex;
      background: #fdf2f4;
      padding: 3px;
      gap: 3px;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      min-width: 75px;
      padding: 7px 4px;
      border: none;
      background: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: #a0aec0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 1px 5px rgba(255, 141, 161, 0.16);
    }

    .tab-content {
      display: none;
      padding: 12px 10px;
    }
    .tab-content.active {
      display: block;
    }

    /* 입력 요소 */
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 3px;
      color: #4a5568;
    }
    input[type="text"], input[type="date"], input[type="url"], textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1.2px solid var(--border);
      border-radius: 7px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      background: #fff;
      transition: border 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
    }
    textarea {
      resize: vertical;
      min-height: 55px;
    }

    /* 핑크 메인 버튼 */
    .pink-btn {
      width: 100%;
      padding: 8px 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(255, 141, 161, 0.2);
    }
    .pink-btn:hover {
      filter: brightness(0.96);
    }

    .list-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ================================================= */
    /* 🖥️ PC / 웹 화면 전용 스타일 (너비 768px 이상일 때 자동 확대) */
    /* ================================================= */
    @media (min-width: 768px) {
      body {
        padding: 24px 16px;
      }
      .container {
        border-radius: 18px;
      }
      header {
        padding: 20px 20px 14px;
      }
      header h1 {
        font-size: 1.45rem;
      }
      header p {
        font-size: 0.88rem;
      }

      /* 🗺️ PC에서 시원시원해지는 로드맵 */
      .roadmap-card {
        padding: 16px 20px;
        margin: 14px 16px 8px;
        border-radius: 14px;
      }
      .roadmap-header {
        margin-bottom: 12px;
        padding-bottom: 8px;
      }
      .roadmap-title {
        font-size: 1.05rem;
      }
      .roadmap-badge {
        font-size: 0.82rem;
        padding: 4px 12px;
        border-radius: 14px;
      }
      .roadmap-steps {
        gap: 10px;
      }
      .step-box {
        min-width: 140px;
        padding: 12px 14px;
        border-radius: 10px;
      }
      .step-label {
        font-size: 0.72rem;
      }
      .step-name {
        font-size: 0.95rem;
        margin-top: 3px;
      }
      .step-desc {
        display: block; /* PC에서는 상세 설명도 친절하게 표시 */
      }
      .step-arrow {
        font-size: 1.1rem;
      }

      /* 탭 및 내용 확장 */
      .tab-bar {
        padding: 5px;
        gap: 5px;
      }
      .tab-btn {
        padding: 10px 8px;
        font-size: 0.92rem;
        border-radius: 10px;
      }
      .tab-content {
        padding: 20px 18px;
      }
      input[type="text"], input[type="date"], input[type="url"], textarea {
        padding: 9px 12px;
        font-size: 0.92rem;
      }
      .pink-btn {
        padding: 10px 16px;
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌸 PROJECT-0</h1>
    <p>2인 기획·개발 협업 대시보드</p>
  </header>

  <!-- 🗺️ 반응형 로드맵 (모바일은 슬림, PC는 큼직) -->
  <div class="roadmap-card">
    <div class="roadmap-header">
      <span class="roadmap-title">🗺️ 프로젝트 로드맵</span>
      <span class="roadmap-badge">STEP 2 진행 중 🚀</span>
    </div>

    <div class="roadmap-steps">
      <div class="step-box" style="background: #f0fbf4; border: 1.2px solid #b7eec9;">
        <div class="step-label" style="color: #27ae60;">STEP 1 ✅</div>
        <div class="step-name" style="color: #2d3436;">기반 환경 구축</div>
        <div class="step-desc">배포 & 모바일 연동</div>
      </div>
      <span class="step-arrow" style="color: #ffb7c5;">➜</span>
      <div class="step-box" style="background: #fff0f3; border: 1.5px solid #ff8fa3; box-shadow: 0 2px 6px rgba(216,90,127,0.12);">
        <div class="step-label" style="color: #d85a7f;">STEP 2 🚀</div>
        <div class="step-name" style="color: #d85a7f; font-weight: 800;">협업 보드 확장</div>
        <div class="step-desc" style="color: #7f5262;">메뉴 탭 & 실시간 기록</div>
      </div>
      <span class="step-arrow">➜</span>
      <div class="step-box" style="background: #fbfbfb; border: 1px solid #e0e0e0;">
        <div class="step-label" style="color: #95a5a6;">STEP 3</div>
        <div class="step-name" style="color: #7f8c8d;">데이터 보관소</div>
        <div class="step-desc">자료 & 영상 아카이빙</div>
      </div>
      <span class="step-arrow" style="color: #eee;">➜</span>
      <div class="step-box" style="background: #fbfbfb; border: 1px solid #e0e0e0;">
        <div class="step-label" style="color: #bdc3c7;">STEP 4</div>
        <div class="step-name" style="color: #95a5a6;">핵심 기능 개발</div>
        <div class="step-desc">본격 기능 구현·테스트</div>
      </div>
    </div>
  </div>

  <!-- 🌸 탭 메뉴 바 -->
  <div class="tab-bar">
    <button id="btn-t" class="tab-btn active" onclick="switchTab('tasks')">✅ 진행목록</button>
    <button id="btn-m" class="tab-btn" onclick="switchTab('meetings')">📋 회의록</button>
    <button id="btn-i" class="tab-btn" onclick="switchTab('ideas')">💡 아이디어</button>
    <button id="btn-r" class="tab-btn" onclick="switchTab('resources')">📁 자료 링크</button>
  </div>

  <!-- 1. 프로젝트 진행목록 화면 -->
  <div id="tab-tasks" class="tab-content active">
    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
      <input type="text" id="task-input" placeholder="새 작업을 입력하세요..." style="flex: 1;" onkeypress="handleTaskKey(event)">
      <button class="pink-btn" style="width: auto; padding: 7px 16px;" onclick="addTask()">추가</button>
    </div>
    <div class="list-container" id="tasks-list"></div>
  </div>

  <!-- 2. 회의록 탭 -->
  <div id="tab-meetings" class="tab-content">
    <div style="background: white; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 6px rgba(255, 183, 197, 0.12); border: 1.2px solid #ffd1dc; margin-bottom: 12px;">
      <h3 style="color: #d85a7f; margin: 0 0 8px 0; font-size: 0.92rem;">📝 회의록 작성</h3>
      <div class="form-group">
        <label for="m-date">회의 날짜</label>
        <input type="date" id="m-date">
      </div>
      <div class="form-group">
        <label for="m-content">회의 내용</label>
        <textarea id="m-content" placeholder="통화/회의에서 나온 주요 내용을 간단히 적어보세요..."></textarea>
      </div>
      <button class="pink-btn" onclick="addMeeting()">회의록 저장</button>
    </div>
    <div class="list-container" id="meetings-list"></div>
  </div>

  <!-- 3. 아이디어 / 메모 탭 -->
  <div id="tab-ideas" class="tab-content">
    <div style="background: white; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 6px rgba(255, 183, 197, 0.12); border: 1.2px solid #ffd1dc; margin-bottom: 12px;">
      <h3 style="color: #d85a7f; margin: 0 0 8px 0; font-size: 0.92rem;">💡 아이디어 메모</h3>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <input type="text" id="idea-title" placeholder="아이디어 제목 또는 키워드">
        <textarea id="idea-desc" rows="2" placeholder="자유로운 생각, 아이디어 상세 메모..."></textarea>
        <button class="pink-btn" style="align-self: flex-end; width: auto; padding: 7px 18px;" onclick="addIdea()">메모 남기기</button>
      </div>
    </div>
    <div class="list-container" id="ideas-list"></div>
  </div>

  <!-- 4. 자료 & 녹화 링크 탭 -->
  <div id="tab-resources" class="tab-content">
    <div style="background: white; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 6px rgba(255, 183, 197, 0.12); border: 1.2px solid #ffd1dc; margin-bottom: 12px;">
      <h3 style="color: #d85a7f; margin: 0 0 8px 0; font-size: 0.92rem;">📁 자료 & 녹화 링크 보관</h3>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <input type="text" id="res-title" placeholder="자료 이름 (예: 1회차 녹화)" style="flex: 1; min-width: 140px;">
        <input type="url" id="res-url" placeholder="공유 링크 (https://...)" style="flex: 1.5; min-width: 180px;">
        <button class="pink-btn" style="width: auto; padding: 7px 18px;" onclick="addResource()">링크 저장</button>
      </div>
    </div>
    <div class="list-container" id="resources-list"></div>
  </div>
</div>

<script>
  // ==========================================
  // 1. Supabase 접속 설정
  // ==========================================
  const SUPABASE_URL = "https://ykhsjjaspagnplzrabyy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_N-orkQ3J2ew4kxCLMmiYSQ_0ioDhbi5";
  window.supabase = window.supabase.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : supabase;

  const mDateInput = document.getElementById('m-date');
  if (mDateInput) mDateInput.valueAsDate = new Date();

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  // ==========================================
  // 2. 탭 전환 기능
  // ==========================================
  window.switchTab = function(type) {
    const allTabs = ['tasks', 'meetings', 'ideas', 'resources'];
    allTabs.forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (el) { el.classList.remove('active'); el.style.display = 'none'; }
    });

    const allBtns = ['btn-t', 'btn-m', 'btn-i', 'btn-r'];
    allBtns.forEach(b => {
      const el = document.getElementById(b);
      if (el) el.classList.remove('active');
    });

    const targetTab = document.getElementById('tab-' + type);
    if (targetTab) { targetTab.classList.add('active'); targetTab.style.display = 'block'; }

    const btnMap = { 'tasks': 'btn-t', 'meetings': 'btn-m', 'ideas': 'btn-i', 'resources': 'btn-r' };
    const targetBtn = document.getElementById(btnMap[type]);
    if (targetBtn) targetBtn.classList.add('active');
  };

  // ==========================================
  // 3. 프로젝트 진행목록 (tasks)
  // ==========================================
  let editingTaskId = null;

  async function loadTasks() {
    const list = document.getElementById('tasks-list');
    if (!list) return;

    const { data: tasks, error } = await supabase
      .from('tasks')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) { console.error("작업 불러오기 오류:", error); return; }

    if (!tasks || tasks.length === 0) {
      list.innerHTML = '<div style="text-align:center; padding:12px; color:#aaa; font-size:0.85rem;">등록된 작업이 없습니다. 🚀</div>';
      return;
    }

    list.innerHTML = tasks.map(task => {
      if (editingTaskId === task.id) {
        return `
          <div style="padding: 7px 10px; margin-bottom: 5px; background: #fffafb; border-radius: 8px; border: 1.2px solid #ff8fa3; display: flex; align-items: center; gap: 6px;">
            <input type="text" id="edit-task-title-${task.id}" value="${escapeHtml(task.title || '')}" style="flex: 1; padding: 5px 8px; border: 1px solid #ffd1dc; border-radius: 6px; font-size: 0.85rem;">
            <div style="display: flex; gap: 4px; flex-shrink: 0;">
              <button onclick="saveEditTask(${task.id})" class="pink-btn" style="padding: 5px 10px; font-size: 0.78rem; border-radius: 6px; width:auto; white-space: nowrap;">저장</button>
              <button onclick="cancelEditTask()" style="padding: 5px 10px; font-size: 0.78rem; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; white-space: nowrap;">취소</button>
            </div>
          </div>
        `;
      }

      const isDone = task.is_completed === true;
      return `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-bottom: 5px; background: white; border-radius: 8px; border: 1.2px solid #ffe4e9; box-shadow: 0 1px 4px rgba(255,183,197,0.06);">
          <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTask(${task.id}, this.checked)" style="cursor: pointer; width: 15px; height: 15px; accent-color: var(--primary);">
            <span style="font-size: 0.88rem; color: ${isDone ? '#aaa' : '#333'}; text-decoration: ${isDone ? 'line-through' : 'none'}; word-break: break-all;">
              ${escapeHtml(task.title || '')}
            </span>
          </div>
          <div style="display: flex; gap: 6px; align-items: center; flex-shrink: 0;">
            <button onclick="startEditTask(${task.id})" style="background: none; border: none; color: #d85a7f; cursor: pointer; font-size: 0.8rem; font-weight: bold; padding: 2px;">수정</button>
            <button onclick="deleteTask(${task.id})" style="background: none; border: none; color: #ff8fa3; cursor: pointer; font-size: 0.8rem; font-weight: bold; padding: 2px;">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function startEditTask(id) { editingTaskId = id; loadTasks(); }
  function cancelEditTask() { editingTaskId = null; loadTasks(); }

  async function saveEditTask(id) {
    const input = document.getElementById(`edit-task-title-${id}`);
    const newTitle = input.value.trim();
    if (!newTitle) { alert('작업 내용을 입력해주세요!'); return; }
    const { error } = await supabase.from('tasks').update({ title: newTitle }).eq('id', id);
    if (error) { alert("수정 실패: " + error.message); return; }
    editingTaskId = null;
    loadTasks();
  }

  async function addTask() {
    const input = document.getElementById('task-input');
    const taskTitle = input.value.trim();
    if (!taskTitle) return;
    const { error } = await supabase.from('tasks').insert([{ title: taskTitle, is_completed: false }]);
    if (error) { alert("작업 추가 실패: " + error.message); return; }
    input.value = '';
    loadTasks();
  }

  function handleTaskKey(event) { if (event.key === 'Enter') addTask(); }

  async function toggleTask(id, status) {
    await supabase.from('tasks').update({ is_completed: status }).eq('id', id);
    loadTasks();
  }

  async function deleteTask(id) {
    if (!confirm('이 작업을 삭제할까요?')) return;
    await supabase.from('tasks').delete().eq('id', id);
    loadTasks();
  }

  // ==========================================
  // 4. 회의록 (meetings)
  // ==========================================
  let editingMeetingId = null;

  async function loadMeetings() {
    const list = document.getElementById('meetings-list');
    if (!list) return;

    const { data: meetings, error } = await supabase
      .from('meetings')
      .select('*')
      .order('meeting_date', { ascending: false });

    if (error) { console.error("회의록 불러오기 오류:", error); return; }

    if (!meetings || meetings.length === 0) {
      list.innerHTML = '<div style="text-align:center; padding:12px; color:#aaa; font-size:0.85rem;">등록된 회의록이 없습니다. 📝</div>';
      return;
    }

    list.innerHTML = meetings.map(m => {
      if (editingMeetingId === m.id) {
        return `
          <div style="padding: 10px; margin-bottom: 8px; background: #fffafb; border-radius: 8px; border: 1.2px solid #ff8fa3;">
            <div style="font-weight: bold; color: #d85a7f; margin-bottom: 4px; font-size: 0.85rem;">✏️ 회의록 수정</div>
            <input type="date" id="edit-m-date-${m.id}" value="${m.meeting_date || ''}" style="padding: 4px 6px; border: 1px solid #ffd1dc; border-radius: 5px; margin-bottom: 5px; font-size:0.82rem;">
            <textarea id="edit-m-content-${m.id}" rows="3" placeholder="회의 내용" style="width: 100%; box-sizing: border-box; padding: 5px 6px; margin-bottom: 6px; border: 1px solid #ffd1dc; border-radius: 5px; font-size:0.82rem;">${escapeHtml(m.content || '')}</textarea>
            <div style="display: flex; justify-content: flex-end; gap: 4px;">
              <button onclick="cancelEditMeeting()" style="padding: 4px 10px; border: 1px solid #ccc; background: white; border-radius: 5px; cursor: pointer; font-size: 0.78rem;">취소</button>
              <button onclick="saveEditMeeting(${m.id})" class="pink-btn" style="padding: 4px 10px; border-radius: 5px; font-size: 0.78rem; width: auto;">저장</button>
            </div>
          </div>
        `;
      }

      return `
        <div style="position: relative; padding: 12px 14px; margin-bottom: 8px; background: white; border-radius: 10px; border: 1.2px solid #ffe4e9; box-shadow: 0 1px 4px rgba(255,183,197,0.06);">
          <div style="font-weight: bold; color: #d85a7f; font-size: 0.92rem; margin-bottom: 4px;">
            📅 ${m.meeting_date || ''}
          </div>
          <div style="color: #333; font-size: 0.86rem; white-space: pre-wrap; line-height: 1.45;">${escapeHtml(m.content || '')}</div>
          <div style="position: absolute; top: 10px; right: 10px; display: flex; gap: 4px;">
            <button onclick="startEditMeeting(${m.id})" style="background: none; border: none; color: #d85a7f; cursor: pointer; font-size: 0.78rem; font-weight: bold; padding: 2px;">수정</button>
            <button onclick="deleteMeeting(${m.id})" style="background: none; border: none; color: #ff8fa3; cursor: pointer; font-size: 0.78rem; font-weight: bold; padding: 2px;">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function startEditMeeting(id) { editingMeetingId = id; loadMeetings(); }
  function cancelEditMeeting() { editingMeetingId = null; loadMeetings(); }

  async function saveEditMeeting(id) {
    const date = document.getElementById(`edit-m-date-${id}`).value;
    const content = document.getElementById(`edit-m-content-${id}`).value.trim();
    if (!content) { alert('회의 내용은 비워둘 수 없습니다!'); return; }
    const { error } = await supabase.from('meetings').update({ meeting_date: date, content: content }).eq('id', id);
    if (error) { alert("수정 실패: " + error.message); return; }
    editingMeetingId = null;
    loadMeetings();
  }

  async function addMeeting() {
    const date = document.getElementById('m-date').value;
    const content = document.getElementById('m-content').value.trim();
    if (!content) { alert('회의 내용을 입력해주세요!'); return; }
    const { error } = await supabase.from('meetings').insert([{ meeting_date: date, content: content }]);
    if (error) { alert("회의록 저장 실패: " + error.message); return; }
    document.getElementById('m-content').value = "";
    loadMeetings();
  }

  async function deleteMeeting(id) {
    if (!confirm("이 회의록을 삭제할까요?")) return;
    const { error } = await supabase.from('meetings').delete().eq('id', id);
    if (error) { alert("삭제 실패: " + error.message); return; }
    loadMeetings();
  }

  // ==========================================
  // 5. 아이디어 메모 (ideas)
  // ==========================================
  let editingIdeaId = null;

  async function loadIdeas() {
    const container = document.getElementById('ideas-list');
    if (!container) return;

    const { data: ideas, error } = await supabase
      .from('ideas')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) { console.error("아이디어 불러오기 오류:", error); return; }

    if (!ideas || ideas.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:12px; color:#aaa; font-size:0.85rem;">등록된 아이디어가 없습니다. ✨</div>';
      return;
    }

    container.innerHTML = ideas.map(item => {
      if (editingIdeaId === item.id) {
        return `
          <div style="padding: 10px; margin-bottom: 6px; background: #fffafb; border-radius: 8px; border: 1.2px solid #ff8fa3;">
            <div style="font-weight: bold; color: #d85a7f; margin-bottom: 4px; font-size: 0.82rem;">✏️ 아이디어 수정 중</div>
            <input type="text" id="edit-idea-title-${item.id}" value="${escapeHtml(item.title || '')}" style="width: 100%; box-sizing: border-box; padding: 5px 8px; margin-bottom: 5px; border: 1px solid #ffd1dc; border-radius: 5px; font-size:0.82rem;">
            <textarea id="edit-idea-desc-${item.id}" rows="2" style="width: 100%; box-sizing: border-box; padding: 5px 8px; margin-bottom: 6px; border: 1px solid #ffd1dc; border-radius: 5px; font-size:0.82rem;">${escapeHtml(item.description || '')}</textarea>
            <div style="display: flex; justify-content: flex-end; gap: 4px;">
              <button onclick="cancelEditIdea()" style="padding: 4px 10px; border: 1px solid #ccc; background: white; border-radius: 5px; cursor: pointer; font-size: 0.78rem;">취소</button>
              <button onclick="saveEditIdea(${item.id})" class="pink-btn" style="padding: 4px 10px; border-radius: 5px; font-size: 0.78rem; width: auto;">저장</button>
            </div>
          </div>
        `;
      }

      const dateStr = item.created_at ? new Date(item.created_at).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';

      return `
        <div style="position: relative; padding: 10px 12px; margin-bottom: 6px; background: white; border-radius: 8px; border: 1.2px solid #ffe4e9; box-shadow: 0 1px 4px rgba(255,183,197,0.06);">
          <div style="font-weight: bold; color: #d85a7f; font-size: 0.88rem; margin-bottom: 3px;">💡 ${escapeHtml(item.title || '')}</div>
          <div style="color: #444; font-size: 0.82rem; white-space: pre-wrap; line-height: 1.4;">${escapeHtml(item.description || '')}</div>
          <div style="font-size: 0.7rem; color: #aaa; margin-top: 5px;">${dateStr}</div>
          <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;">
            <button onclick="startEditIdea(${item.id})" style="background: none; border: none; color: #d85a7f; cursor: pointer; font-size: 0.78rem; font-weight: bold;">수정</button>
            <button onclick="deleteIdea(${item.id})" style="background: none; border: none; color: #ff8fa3; cursor: pointer; font-size: 0.78rem; font-weight: bold;">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function startEditIdea(id) { editingIdeaId = id; loadIdeas(); }
  function cancelEditIdea() { editingIdeaId = null; loadIdeas(); }

  async function saveEditIdea(id) {
    const title = document.getElementById(`edit-idea-title-${id}`).value.trim();
    const desc = document.getElementById(`edit-idea-desc-${id}`).value.trim();
    if (!title) { alert('아이디어 제목은 비워둘 수 없습니다!'); return; }
    const { error } = await supabase.from('ideas').update({ title: title, description: desc }).eq('id', id);
    if (error) { alert("수정 실패: " + error.message); return; }
    editingIdeaId = null;
    loadIdeas();
  }

  async function addIdea() {
    const titleInput = document.getElementById('idea-title');
    const descInput = document.getElementById('idea-desc');
    const title = titleInput.value.trim();
    const desc = descInput.value.trim();
    if (!title) { alert('아이디어 제목을 입력해주세요!'); return; }

    const { error } = await supabase.from('ideas').insert([{ title: title, description: desc }]);
    if (error) { alert("아이디어 저장 실패: " + error.message); return; }

    titleInput.value = '';
    descInput.value = '';
    loadIdeas();
  }

  async function deleteIdea(id) {
    if (!confirm('이 아이디어를 삭제할까요?')) return;
    const { error } = await supabase.from('ideas').delete().eq('id', id);
    if (error) { alert("삭제 실패: " + error.message); return; }
    loadIdeas();
  }

  // ==========================================
  // 6. 자료 & 녹화 링크 (resources)
  // ==========================================
  let editingResourceId = null;

  async function loadResources() {
    const container = document.getElementById('resources-list');
    if (!container) return;

    const { data: resources, error } = await supabase
      .from('resources')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) { console.error("자료 목록 불러오기 오류:", error); return; }

    if (!resources || resources.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:12px; color:#aaa; font-size:0.85rem;">저장된 링크가 없습니다. 📁</div>';
      return;
    }

    container.innerHTML = resources.map(item => {
      if (editingResourceId === item.id) {
        return `
          <div style="padding: 10px; margin-bottom: 6px; background: #fffafb; border-radius: 8px; border: 1.2px solid #ff8fa3;">
            <div style="font-weight: bold; color: #d85a7f; margin-bottom: 4px; font-size: 0.82rem;">✏️ 링크 정보 수정 중</div>
            <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px;">
              <input type="text" id="edit-res-title-${item.id}" value="${escapeHtml(item.title || '')}" style="flex: 1; min-width: 120px; padding: 4px 8px; border: 1px solid #ffd1dc; border-radius: 5px; font-size:0.82rem;">
              <input type="url" id="edit-res-url-${item.id}" value="${escapeHtml(item.url || '')}" style="flex: 1.4; min-width: 150px; padding: 4px 8px; border: 1px solid #ffd1dc; border-radius: 5px; font-size:0.82rem;">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 4px;">
              <button onclick="cancelEditResource()" style="padding: 4px 10px; border: 1px solid #ccc; background: white; border-radius: 5px; cursor: pointer; font-size: 0.78rem;">취소</button>
              <button onclick="saveEditResource(${item.id})" class="pink-btn" style="padding: 4px 10px; border-radius: 5px; font-size: 0.78rem; width: auto;">저장</button>
            </div>
          </div>
        `;
      }

      return `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-bottom: 6px; background: white; border-radius: 8px; border: 1.2px solid #ffe4e9; flex-wrap: nowrap; gap: 8px; box-shadow: 0 1px 4px rgba(255,183,197,0.06);">
          <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">
            <span style="font-size: 1.05rem; flex-shrink: 0;">🎬</span>
            <div style="min-width: 0; overflow: hidden;">
              <div style="font-weight: bold; color: #333; font-size: 0.85rem; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                ${escapeHtml(item.title || '')}
              </div>
              <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" style="color: #d85a7f; font-size: 0.78rem; text-decoration: underline; word-break: break-all; display: inline-block;">
                ${escapeHtml(item.url || '')} ↗
              </a>
            </div>
          </div>
          <div style="display: flex; flex-direction: row; gap: 4px; align-items: center; flex-shrink: 0;">
            <button onclick="startEditResource(${item.id})" style="background: none; border: none; color: #d85a7f; cursor: pointer; font-size: 0.78rem; font-weight: bold; padding: 2px;">수정</button>
            <button onclick="deleteResource(${item.id})" style="background: none; border: none; color: #ff8fa3; cursor: pointer; font-size: 0.78rem; font-weight: bold; padding: 2px;">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function startEditResource(id) { editingResourceId = id; loadResources(); }
  function cancelEditResource() { editingResourceId = null; loadResources(); }

  async function saveEditResource(id) {
    const title = document.getElementById(`edit-res-title-${id}`).value.trim();
    let url = document.getElementById(`edit-res-url-${id}`).value.trim();
    if (!title || !url) { alert('자료 이름과 링크 URL을 모두 입력해주세요!'); return; }
    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

    const { error } = await supabase.from('resources').update({ title: title, url: url }).eq('id', id);
    if (error) { alert("수정 실패: " + error.message); return; }
    editingResourceId = null;
    loadResources();
  }

  async function addResource() {
    const titleInput = document.getElementById('res-title');
    const urlInput = document.getElementById('res-url');
    const title = titleInput.value.trim();
    let url = urlInput.value.trim();
    if (!title || !url) { alert('자료 이름과 링크 URL을 모두 입력해주세요!'); return; }
    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

    const { error } = await supabase.from('resources').insert([{ title: title, url: url }]);
    if (error) { alert("링크 저장 실패: " + error.message); return; }

    titleInput.value = '';
    urlInput.value = '';
    loadResources();
  }

  async function deleteResource(id) {
    if (!confirm('이 링크를 삭제할까요?')) return;
    const { error } = await supabase.from('resources').delete().eq('id', id);
    if (error) { alert("삭제 실패: " + error.message); return; }
    loadResources();
  }

  // ==========================================
  // 7. 앱 시작 시 데이터 로드
  // ==========================================
  switchTab('tasks');
  loadTasks();
  loadMeetings();
  loadIdeas();
  loadResources();
</script>

</body>
</html>
